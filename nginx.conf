server {
    # HTTP 기본 통신 포트인 80번 포트로 들어오는 요청을 대기(수신)
    listen 80;

    # 루트 경로('/')로 들어오는 모든 요청에 대해 아래 블록의 규칙을 적용
    location / {
        # 웹 서버가 읽어올 정적 파일(HTML, JS, CSS 등)이 위치한 기본 디렉터리를 지정합니다.
        root /usr/share/nginx/html;

        # 디렉터리 요청 시 기본으로 반환할 파일 이름과 순서를 설정. (index.html 우선 참조)
        index index.html index.htm;

        # 요청한 파일/디렉터리가 존재하지 않을 때 index.html로 리다이렉트(라우팅)
        # SPA(React, Vue 등)의 클라이언트 사이드 라우팅을 지원하기 위한 핵심 설정
        try_files $uri $uri/ /index.html;
    }
}